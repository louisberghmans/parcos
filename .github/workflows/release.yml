name: Release container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            exit 1
          fi
      - run: npm run check
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke-test image
        run: |
          docker build \
            --build-arg "PARCOS_VERSION=$(node -p 'require("./package.json").version')" \
            --tag parcos:release-test .
      - name: Smoke test built container
        shell: bash
        run: |
          volume="$(docker volume create)"
          container=""
          cleanup() {
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null 2>&1 || true; fi
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          container="$(docker run -d \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e PARCOS_ADMIN_PASSWORD=release-smoke-password \
            -v "$volume:/data" \
            -p 127.0.0.1::3000 \
            parcos:release-test)"
          port="$(docker port "$container" 3000/tcp | sed 's/.*://')"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          echo "Container did not become healthy." >&2
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/parcos
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PARCOS_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "ParcOS ${GITHUB_REF_NAME#v}"
